<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>Read rate chart (slide 15 style)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Same chart as deck/slides/15-poc.html, sized as a standalone figure for the proposal. */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 720px; background: #ffffff; overflow: hidden; }
  body { font-family: "IBM Plex Sans Thai", sans-serif; color: #1d1d1b; display: flex; gap: 20px; padding: 24px 32px 12px 8px; }
  #lg { padding-top: 40px; width: 380px; flex: none; }
  .lg-row { display: flex; align-items: center; gap: 12px; font-size: 21px; color: #5f5e5a; line-height: 1.7; }
  .lg-main { color: #a8361f; font-weight: 700; }
</style>
</head>
<body>
  <svg id="c" width="1190" height="680"></svg>
  <div id="lg"></div>
<script src="../slides/poc.js"></script>
<script>
  const t = { font: "IBM Plex Sans Thai", ink: "#1d1d1b", muted: "#5f5e5a", grid: "#e6e4de", band: "#f1e4de", bandText: "#a8361f", accent: "#a8361f", bg: "#ffffff", labelSize: 23, tickSize: 21,
    others: { full: { color: "#b9b7b0", dash: "", width: 3 }, crop: { color: "#6f6d67", dash: "", width: 3 }, warp: { color: "#6f6d67", dash: "10 8", width: 3 }, oracle: { color: "#1d1d1b", dash: "3 7", width: 3 } } };
  drawPoc(document.getElementById("c"), 1190, 680, t);
  pocLegend(document.getElementById("lg"), t);
</script>
</body>
</html>

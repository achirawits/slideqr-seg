<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>02 ผู้จัดทำและอาจารย์ที่ปรึกษา</title>
<link rel="stylesheet" href="theme.css">
<style>
  .people { display: grid; grid-template-columns: repeat(3, 1fr); gap: 64px; margin-top: 44px; }
  .p { border-top: 2px solid var(--ink); padding-top: 22px; }
  .p.adv { border-top-color: var(--accent); }
  .photo { width: 100%; height: 470px; overflow: hidden; background: #f1efea; }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
  .role { margin-top: 22px; font-size: 20px; font-weight: 600; color: var(--muted); }
  .adv .role { color: var(--accent); }
  .name { font-size: 34px; font-weight: 600; line-height: 1.3; margin-top: 4px; }
  .meta { font-size: 24px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .meta span { display: block; }
</style>
</head>
<body data-section="" data-note="">
  <h1>ผู้จัดทำและอาจารย์ที่ปรึกษา</h1>
  <div class="people">
    <div class="p">
      <div class="photo"><img src="../assets/team_achirawit.png" alt="นายอชิรวิทย์ ศรีชา"></div>
      <p class="role">ผู้จัดทำ</p>
      <p class="name">นายอชิรวิทย์ ศรีชา</p>
      <p class="meta"><span>673380353-1</span><span>achirawit.s@kkumail.com</span></p>
    </div>
    <div class="p">
      <div class="photo"><img src="../assets/team_teerapat.jpg" alt="นายธีรปรัชญ์ สาขาคำ"></div>
      <p class="role">ผู้จัดทำ</p>
      <p class="name">นายธีรปรัชญ์ สาขาคำ</p>
      <p class="meta"><span>673380521-6</span><span>teeraprat.s@kkumail.com</span></p>
    </div>
    <div class="p adv">
      <div class="photo"><img src="../assets/team_advisor.webp" alt="ผศ.ดร.ไพรสันต์ ผดุงเวียง"></div>
      <p class="role">อาจารย์ที่ปรึกษาโครงงาน</p>
      <p class="name">ผศ.ดร.ไพรสันต์ ผดุงเวียง</p>
      <p class="meta"><span>praipa@kku.ac.th</span></p>
    </div>
  </div>
<script src="page.js"></script>
</body>
</html>
